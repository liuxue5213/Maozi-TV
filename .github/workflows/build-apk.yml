name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 授予 Gradle 执行权限
        run: chmod +x android/gradlew 2>/dev/null || true

      - name: 生成 Gradle Wrapper
        working-directory: ./android
        run: |
          if [ ! -f gradlew ]; then
            apt-get update && apt-get install -y wget unzip
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            /tmp/gradle/gradle-8.5/bin/gradle wrapper --gradle-version=8.5
          fi

      - name: 编译 Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: 签名 APK (debug key)
        working-directory: ./android
        run: |
          # 用 debug 签名 (无密码签名，便于安装)
          keytool -genkey -v -keystore debug.keystore -alias debug \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=MaoziTV, OU=Dev, O=Maozi, L=Beijing, S=Beijing, C=CN" 2>/dev/null || true
          # 签名
          java -jar $ANDROID_HOME/build-tools/*/apksigner.jar sign \
            --ks debug.keystore --ks-pass pass:android \
            --key-pass pass:android \
            app/build/outputs/apk/release/app-release-unsigned.apk 2>/dev/null || true

      - name: 对齐 APK (zipalign)
        working-directory: ./android
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/MaoziTV.apk
          $ANDROID_HOME/build-tools/*/zipalign -f 4 app/build/outputs/apk/release/MaoziTV.apk app/build/outputs/apk/release/MaoziTV-aligned.apk 2>/dev/null || true
          mv app/build/outputs/apk/release/MaoziTV-aligned.apk app/build/outputs/apk/release/MaoziTV.apk 2>/dev/null || true

      - name: 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaoziTV-APK
          path: android/app/build/outputs/apk/release/MaoziTV.apk
          if-no-files-found: warn
          retention-days: 30
