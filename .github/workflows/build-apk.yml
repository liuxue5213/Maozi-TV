name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>&1 | tail -5

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 生成 Gradle Wrapper
        working-directory: ./android
        run: |
          if [ ! -f gradlew ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq wget unzip
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            /tmp/gradle/gradle-8.5/bin/gradle wrapper --gradle-version=8.5
          fi
          chmod +x gradlew

      - name: 编译 Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: 签名 APK
        working-directory: ./android
        run: |
          # Debug 签名（自动通过）
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkey -v -keystore "$DEBUG_KEYSTORE" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null
          fi
          # 复制并签名
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             app/build/outputs/apk/release/MaoziTV-unaligned.apk
          # apksigner 签名
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ -f "$APKSIGNER" ]; then
            "$APKSIGNER" sign --ks "$DEBUG_KEYSTORE" \
              --ks-pass pass:android --key-pass pass:android \
              --out app/build/outputs/apk/release/MaoziTV-signed.apk \
              app/build/outputs/apk/release/MaoziTV-unaligned.apk
          else
            # fallback: 直接用未签名的（低版本 Android 也可安装）
            cp app/build/outputs/apk/release/MaoziTV-unaligned.apk \
               app/build/outputs/apk/release/MaoziTV-signed.apk
          fi

      - name: 对齐 APK (zipalign)
        working-directory: ./android
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"
          if [ -f "$ZIPALIGN" ]; then
            "$ZIPALIGN" -f -v 4 \
              app/build/outputs/apk/release/MaoziTV-signed.apk \
              app/build/outputs/apk/release/MaoziTV.apk 2>&1 | tail -3
          else
            cp app/build/outputs/apk/release/MaoziTV-signed.apk \
               app/build/outputs/apk/release/MaoziTV.apk
          fi
          ls -lh app/build/outputs/apk/release/MaoziTV.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MaoziTV-APK
          path: android/app/build/outputs/apk/release/MaoziTV.apk
          if-no-files-found: error
          retention-days: 30
