name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>&1 | tail -5

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 生成 Gradle Wrapper
        working-directory: ./android
        run: |
          if [ ! -f gradlew ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq wget unzip
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            /tmp/gradle/gradle-8.5/bin/gradle wrapper --gradle-version=8.5
          fi
          chmod +x gradlew

      - name: 编译 Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: 签名 APK
        working-directory: ./android
        run: |
          # 检查未签名 APK 是否存在
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "❌ 未找到未签名 APK: $UNSIGNED_APK"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi

          # 创建 debug keystore
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore "$DEBUG_KEYSTORE" \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true

          # 使用 apksigner 签名
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          if [ -f "$APKSIGNER" ]; then
            echo "使用 apksigner 签名..."
            "$APKSIGNER" sign --ks "$DEBUG_KEYSTORE" \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              --out app/build/outputs/apk/release/MaoziTV-signed.apk \
              "$UNSIGNED_APK"
            echo "✅ APK 签名成功"
          else
            echo "⚠️ apksigner 未找到，使用 jarsigner 备用签名..."
            jarsigner -verbose -keystore "$DEBUG_KEYSTORE" \
              -storepass android -keypass android \
              -signedjar app/build/outputs/apk/release/MaoziTV-signed.apk \
              "$UNSIGNED_APK" androiddebugkey
          fi

          # 验证签名
          if [ -f "$APKSIGNER" ]; then
            "$APKSIGNER" verify app/build/outputs/apk/release/MaoziTV-signed.apk && echo "✅ 签名验证通过"
          fi

      - name: 对齐 APK (zipalign)
        working-directory: ./android
        run: |
          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"
          SIGNED_APK="app/build/outputs/apk/release/MaoziTV-signed.apk"
          FINAL_APK="app/build/outputs/apk/release/MaoziTV.apk"

          if [ -f "$ZIPALIGN" ]; then
            echo "使用 zipalign 对齐..."
            "$ZIPALIGN" -f -v 4 "$SIGNED_APK" "$FINAL_APK" 2>&1 | tail -3
          else
            cp "$SIGNED_APK" "$FINAL_APK"
          fi

          echo "📦 最终 APK 信息:"
          ls -lh "$FINAL_APK"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MaoziTV-APK
          path: android/app/build/outputs/apk/release/MaoziTV.apk
          if-no-files-found: error
          retention-days: 30
