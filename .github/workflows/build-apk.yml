name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" 2>&1 | tail -5

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 生成 Gradle Wrapper
        working-directory: ./android
        run: |
          if [ ! -f gradlew ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq wget unzip
            wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            /tmp/gradle/gradle-8.5/bin/gradle wrapper --gradle-version=8.5
          fi
          chmod +x gradlew

      - name: 编译 Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: 重命名 APK
        working-directory: ./android
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MaoziTV-debug.apk
          ls -lh app/build/outputs/apk/debug/MaoziTV-debug.apk

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MaoziTV-Debug-APK
          path: android/app/build/outputs/apk/debug/MaoziTV-debug.apk
          if-no-files-found: error
          retention-days: 30
