version: "1.0"
name: 构建
displayName: 构建 APK
stages:
- name: 构建
  displayName: 编译 Release APK
  strategy: naturally
  trigger: auto
  steps:
  - step: build@android
    name: "build_apk"
    displayName: Android 构建
    # 项目使用 JDK 17 + Gradle 8.5 + build-tools 34
    jdkVersion: "17"
    gradleVersion: "8.5"
    buildToolsVersion: "34.0.0"
    commands:
    - cd android
    - chmod +x ./gradlew
    - ./gradlew assembleRelease --no-daemon --stacktrace
    - cd ..
    artifacts:
    - name: BUILD_ARTIFACT
      path:
      - ./android/app/build/outputs/apk/release
      type: .tar.gz
    caches:
    - "~/.gradle/caches"
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"
triggers:
  trigger: manual
notify: []
strategy:
  blocking: true
