<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>帽子TV — 无广告电视直播</title>
    <link rel="stylesheet" href="style.css">
    <!-- hls.js: load locally (works offline / on restricted networks);
         fall back to CDN if the local file is unavailable. -->
    <script src="hls.min.js" onerror="document.write('<scr'+'ipt src=\"https://cdn.jsdelivr.net/npm/hls.js@latest\"><\/scr'+'ipt>')"></script>
</head>
<body>
<div class="app-container">

    <!-- ── Sidebar ──────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>🎩 帽子TV</h1>
        </div>

        <!-- 搜索框 -->
        <div class="sidebar-search">
            <input type="text" id="search-input" placeholder="搜索频道..." autocomplete="off">
        </div>

        <!-- 国内/国外 大标签 -->
        <div class="sidebar-region-tabs">
            <button class="region-btn active" id="region-domestic">国内</button>
            <button class="region-btn" id="region-international">国外</button>
        </div>

        <!-- Filter tabs -->
        <div class="sidebar-tabs">
            <button class="tab-btn active" id="tab-all">全部</button>
            <button class="tab-btn" id="tab-healthy">在线</button>
            <button class="tab-btn" id="tab-fav">⭐ 收藏</button>
        </div>

        <!-- Channel list -->
        <div class="channel-scroll" id="channel-list">
            <div class="group-label" style="padding:40px;text-align:center;color:var(--text-secondary);">
                正在加载频道列表...
            </div>
        </div>
    </aside>

    <!-- ── Player Area ──────────────────────────────── -->
    <main class="player-area" id="player-area">

        <!-- 常驻菜单按钮（电脑/手机点击打开频道列表；电视盒子用 OK 键） -->
        <button class="menu-toggle" id="menu-toggle" aria-label="频道列表">☰</button>

        <!-- Video container -->
        <div class="video-container" id="video-container">
            <video id="video-player" playsinline autoplay></video>

            <!-- 频道号 OSD -->
            <div class="channel-number-osd" id="channel-number-osd"></div>

            <!-- 频道信息面板 -->
            <div class="channel-info-panel hidden" id="channel-info-panel">
                <div class="info-panel-title">频道信息</div>
                <div class="info-row"><span class="info-label">频道名</span><span class="info-value" id="info-name">—</span></div>
                <div class="info-row"><span class="info-label">分组</span><span class="info-value" id="info-group">—</span></div>
                <div class="info-row"><span class="info-label">源数量</span><span class="info-value" id="info-sources">—</span></div>
                <div class="info-row"><span class="info-label">当前源</span><span class="info-value" id="info-current-source">—</span></div>
                <div class="info-row"><span class="info-label">健康状态</span><span class="info-value" id="info-health">—</span></div>
            </div>

            <!-- 播放器控制栏 -->
            <div class="player-controls hidden" id="player-controls">
                <div class="controls-top">
                    <div class="controls-channel-info">
                        <span class="controls-channel-name" id="controls-channel-name">未选择</span>
                        <span class="controls-group-name" id="controls-group-name"></span>
                    </div>
                    <div class="controls-right">
                        <span class="controls-speed" id="controls-speed"></span>
                    </div>
                </div>
                <div class="controls-bottom">
                    <button class="ctrl-btn" id="btn-prev-ch" title="上一频道">⏮</button>
                    <button class="ctrl-btn" id="btn-play-pause" title="暂停/播放">⏸</button>
                    <button class="ctrl-btn" id="btn-next-ch" title="下一频道">⏭</button>
                    <div class="volume-control">
                        <span class="vol-icon" id="vol-icon">🔊</span>
                        <input type="range" id="volume-slider" min="0" max="100" value="100" class="volume-slider">
                    </div>
                    <button class="ctrl-btn" id="btn-source" title="切换源">🔄</button>
                    <button class="ctrl-btn" id="btn-fullscreen" title="全屏">⛶</button>
                </div>
                <!-- 源选择弹窗 -->
                <div class="source-popup hidden" id="source-popup"></div>
            </div>

            <!-- Volume OSD (ArrowLeft / ArrowRight) -->
            <div class="volume-osd" id="volume-osd">
                <div class="vol-label">🔊 音量</div>
                <div class="vol-bar"><div class="vol-fill"></div></div>
                <div class="vol-pct">50%</div>
            </div>

            <!-- Source status OSD（显示当前源序号/切换状态，让用户知道卡在哪） -->
            <div class="source-osd hidden" id="source-osd">
                <div class="source-osd-icon">📡</div>
                <div class="source-osd-text" id="source-osd-text">正在连接...</div>
                <div class="source-osd-sub" id="source-osd-sub"></div>
            </div>

            <!-- 常驻信号状态指示器（右上角，显示源序号/连接状态/码率/信号格） -->
            <div class="signal-badge hidden" id="signal-badge">
                <div class="signal-bars" id="signal-bars">
                    <span class="bar"></span><span class="bar"></span>
                    <span class="bar"></span><span class="bar"></span>
                </div>
                <div class="signal-info">
                    <span class="signal-source" id="signal-source">源 1</span>
                    <span class="signal-status" id="signal-status">连接中</span>
                    <span class="signal-bitrate" id="signal-bitrate"></span>
                </div>
            </div>

            <!-- Overlay states -->
            <div class="overlay" id="player-overlay">
                <div class="overlay-icon" id="overlay-icon">📺</div>
                <div class="overlay-text" id="overlay-text">点击屏幕选择频道</div>
                <div class="overlay-subtext" id="overlay-subtext"></div>

                <!-- Loading spinner -->
                <div class="spinner hidden" id="loading-spinner"></div>

                <!-- Error state -->
                <div class="hidden" id="error-state">
                    <div class="error-message" id="error-message">播放失败</div>
                    <button class="retry-btn" id="retry-btn">重试</button>
                </div>
            </div>
        </div>

        <!-- Global toast (favorite / refresh feedback) -->
        <div class="toast" id="toast"></div>
    </main>

</div>

<script src="player.js"></script>
</body>
</html>
